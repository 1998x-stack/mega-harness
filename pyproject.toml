[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mega-harness"
version = "0.1.0"
description = "Durable local multi-worker agent orchestration foundation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
mega-harness = "mega_harness.cli:main"

[tool.setuptools.packages.find]
include = ["mega_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
